<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
  <title id="title">용돈 기입장 CLI 실행 흐름</title>
  <desc id="desc">CLI에서 Service, Models, Repository, JSONL 파일로 이어지는 실행 흐름과 Validation 및 종료 코드를 보여주는 다이어그램</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7a8491"/>
    </marker>
    <style>
      .box { fill:#f4f8fc; stroke:#9aa9b8; stroke-width:1.4; }
      .data { fill:#f7fafc; stroke:#9aa9b8; stroke-width:1.4; }
      .exit { fill:#fafafa; stroke:#a7a7a7; stroke-width:1.3; }
      .title { font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#233446; text-anchor:middle; }
      .sub { font:400 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#526273; text-anchor:middle; }
      .edge { fill:none; stroke:#7a8491; stroke-width:1.5; marker-end:url(#arrow); stroke-linejoin:round; }
      .dash { fill:none; stroke:#7a8491; stroke-width:1.4; stroke-dasharray:5 4; marker-end:url(#arrow); stroke-linejoin:round; }
      .label-bg { fill:#fff; }
      .label { font:600 11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#536171; text-anchor:middle; }
    </style>
  </defs>

  <!-- Nodes -->
  <rect class="box" x="275" y="20" width="210" height="62" rx="12"/>
  <text class="title" x="380" y="45">CLI</text>
  <text class="sub" x="380" y="65">명령 파싱 · 입출력</text>

  <rect class="box" x="275" y="125" width="210" height="62" rx="12"/>
  <text class="title" x="380" y="150">Service</text>
  <text class="sub" x="380" y="170">업무 규칙 · 기능 조정</text>

  <rect class="box" x="70" y="245" width="220" height="62" rx="12"/>
  <text class="title" x="180" y="270">Models</text>
  <text class="sub" x="180" y="290">Transaction 데이터 구조</text>

  <rect class="box" x="470" y="245" width="220" height="62" rx="12"/>
  <text class="title" x="580" y="270">Repository</text>
  <text class="sub" x="580" y="290">JSONL 저장 · 조회</text>

  <rect class="data" x="470" y="355" width="220" height="58" rx="22"/>
  <text class="title" x="580" y="379">JSONL 데이터 파일</text>

  <rect class="box" x="70" y="355" width="220" height="62" rx="12"/>
  <text class="title" x="180" y="380">Validation</text>
  <text class="sub" x="180" y="400">공통 입력 · 데이터 검증</text>

  <rect class="exit" x="40" y="515" width="190" height="58" rx="12"/>
  <text class="title" x="135" y="539">정상 종료</text>
  <text class="sub" x="135" y="558">exit 0</text>

  <rect class="exit" x="285" y="515" width="190" height="58" rx="12"/>
  <text class="title" x="380" y="539">처리 오류</text>
  <text class="sub" x="380" y="558">exit 1</text>

  <rect class="exit" x="530" y="515" width="190" height="58" rx="12"/>
  <text class="title" x="625" y="539">인자 오류</text>
  <text class="sub" x="625" y="558">exit 2</text>

  <!-- Main flow -->
  <path class="edge" d="M380 82 L380 125"/>
  <rect class="label-bg" x="343" y="96" width="74" height="18" rx="7"/>
  <text class="label" x="380" y="109">명령 실행</text>

  <path class="edge" d="M345 187 L345 214 L180 214 L180 245"/>
  <rect class="label-bg" x="224" y="201" width="74" height="18" rx="7"/>
  <text class="label" x="261" y="214">거래 생성</text>

  <path class="edge" d="M415 187 L415 214 L580 214 L580 245"/>
  <rect class="label-bg" x="461" y="201" width="86" height="18" rx="7"/>
  <text class="label" x="504" y="214">저장 · 조회</text>

  <path class="edge" d="M580 307 L580 355"/>
  <rect class="label-bg" x="537" y="320" width="86" height="18" rx="7"/>
  <text class="label" x="580" y="333">읽기 · 쓰기</text>

  <!-- Validation: same four dashed relationships as the requested diagram -->
  <path class="dash" d="M275 51 L30 51 L30 386 L70 386"/>
  <path class="dash" d="M275 156 L50 156 L50 376 L70 376"/>
  <path class="dash" d="M180 307 L180 355"/>
  <path class="dash" d="M470 276 L320 276 L320 406 L290 406"/>

  <!-- Exit codes -->
  <path class="edge" d="M345 187 L345 455 L135 455 L135 515"/>
  <rect class="label-bg" x="172" y="443" width="74" height="18" rx="7"/>
  <text class="label" x="209" y="456">정상 완료</text>

  <path class="dash" d="M380 187 L380 515"/>
  <rect class="label-bg" x="321" y="461" width="118" height="18" rx="7"/>
  <text class="label" x="380" y="474">예상 가능한 오류</text>

  <path class="dash" d="M485 51 L730 51 L730 470 L625 470 L625 515"/>
  <rect class="label-bg" x="645" y="456" width="86" height="18" rx="7"/>
  <text class="label" x="688" y="469">argparse 오류</text>
</svg>