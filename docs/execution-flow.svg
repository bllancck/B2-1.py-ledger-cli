<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">용돈 기입장 CLI 실행 흐름</title>
  <desc id="desc">CLI에서 decorators.py, CLI Handler, Service, Models, Repository, Validation, JSONL 파일과 종료 코드로 이어지는 실행 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#788493"/>
    </marker>
    <style>
      .box { fill:#f5f8fb; stroke:#9aa8b6; stroke-width:1.35; }
      .data { fill:#f8fafc; stroke:#9aa8b6; stroke-width:1.35; }
      .exit { fill:#fafafa; stroke:#a7a7a7; stroke-width:1.3; }
      .title { font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#243546; text-anchor:middle; }
      .sub { font:400 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#536272; text-anchor:middle; }
      .edge { fill:none; stroke:#788493; stroke-width:1.5; marker-end:url(#arrow); stroke-linejoin:round; }
      .dash { fill:none; stroke:#788493; stroke-width:1.4; stroke-dasharray:5 4; marker-end:url(#arrow); stroke-linejoin:round; }
      .label-bg { fill:#fff; }
      .label { font:600 11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#526171; text-anchor:middle; }
      .num { font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; fill:#243546; text-anchor:middle; }
    </style>
  </defs>

  <!-- Main nodes -->
  <rect class="box" x="255" y="18" width="210" height="58" rx="12"/>
  <text class="title" x="360" y="42">CLI / argparse</text>
  <text class="sub" x="360" y="61">명령 파싱 · 핸들러 선택</text>

  <rect class="box" x="255" y="108" width="210" height="62" rx="12"/>
  <text class="title" x="360" y="133">decorators.py</text>
  <text class="sub" x="360" y="153">@handle_cli_errors</text>

  <rect class="box" x="255" y="202" width="210" height="62" rx="12"/>
  <text class="title" x="360" y="227">CLI Handler</text>
  <text class="sub" x="360" y="247">입출력 · Service 호출</text>

  <rect class="box" x="255" y="296" width="210" height="62" rx="12"/>
  <text class="title" x="360" y="321">Service</text>
  <text class="sub" x="360" y="341">업무 규칙 · 기능 조정</text>

  <rect class="box" x="55" y="410" width="215" height="62" rx="12"/>
  <text class="title" x="162.5" y="435">Models</text>
  <text class="sub" x="162.5" y="455">Transaction 데이터 구조</text>

  <rect class="box" x="450" y="410" width="215" height="62" rx="12"/>
  <text class="title" x="557.5" y="435">Repository</text>
  <text class="sub" x="557.5" y="455">JSONL 저장 · 조회</text>

  <rect class="box" x="55" y="520" width="215" height="62" rx="12"/>
  <text class="title" x="162.5" y="545">Validation</text>
  <text class="sub" x="162.5" y="565">공통 입력 · 데이터 검증</text>

  <rect class="data" x="450" y="520" width="215" height="58" rx="22"/>
  <text class="title" x="557.5" y="554">JSONL 데이터 파일</text>

  <!-- Exit nodes -->
  <rect class="exit" x="35" y="642" width="185" height="56" rx="12"/>
  <text class="title" x="127.5" y="666">정상 종료</text>
  <text class="sub" x="127.5" y="685">exit 0</text>

  <rect class="exit" x="267.5" y="642" width="185" height="56" rx="12"/>
  <text class="title" x="360" y="666">처리 오류</text>
  <text class="sub" x="360" y="685">exit 1</text>

  <rect class="exit" x="500" y="642" width="185" height="56" rx="12"/>
  <text class="title" x="592.5" y="666">인자 오류</text>
  <text class="sub" x="592.5" y="685">exit 2</text>

  <!-- Numbered normal execution flow -->
  <path class="edge" d="M360 76 L360 108"/>
  <rect class="label-bg" x="294" y="82" width="132" height="18" rx="7"/>
  <text class="num" x="307" y="95">①</text>
  <text class="label" x="367" y="95">핸들러 호출</text>

  <path class="edge" d="M360 170 L360 202"/>
  <rect class="label-bg" x="297" y="176" width="126" height="18" rx="7"/>
  <text class="num" x="310" y="189">②</text>
  <text class="label" x="370" y="189">핸들러 실행</text>

  <path class="edge" d="M360 264 L360 296"/>
  <rect class="label-bg" x="302" y="270" width="116" height="18" rx="7"/>
  <text class="num" x="315" y="283">③</text>
  <text class="label" x="371" y="283">Service 호출</text>

  <path class="edge" d="M325 358 L325 382 L162.5 382 L162.5 410"/>
  <rect class="label-bg" x="199" y="370" width="118" height="18" rx="7"/>
  <text class="num" x="212" y="383">④</text>
  <text class="label" x="264" y="383">거래 생성</text>

  <path class="edge" d="M162.5 472 L162.5 520"/>
  <rect class="label-bg" x="105" y="485" width="115" height="18" rx="7"/>
  <text class="num" x="118" y="498">⑤</text>
  <text class="label" x="171" y="498">필드 검증</text>

  <path class="edge" d="M395 358 L395 382 L557.5 382 L557.5 410"/>
  <rect class="label-bg" x="422" y="370" width="126" height="18" rx="7"/>
  <text class="num" x="435" y="383">⑥</text>
  <text class="label" x="493" y="383">저장 · 조회</text>

  <path class="edge" d="M557.5 472 L557.5 520"/>
  <rect class="label-bg" x="498" y="485" width="119" height="18" rx="7"/>
  <text class="num" x="511" y="498">⑦</text>
  <text class="label" x="566" y="498">읽기 · 쓰기</text>

  <!-- Successful return: control returns to the handler, then exit 0 -->
  <path class="edge" d="M255 233 L20 233 L20 615 L127.5 615 L127.5 642"/>
  <rect class="label-bg" x="37" y="601" width="150" height="18" rx="7"/>
  <text class="num" x="50" y="614">⑧</text>
  <text class="label" x="115" y="614">성공 시 return 0</text>

  <!-- Error flows -->
  <path class="dash" d="M255 233 L232 233 L232 139 L255 139"/>
  <rect class="label-bg" x="148" y="174" width="103" height="18" rx="7"/>
  <text class="label" x="199.5" y="187">예외가 위로 전파</text>

  <path class="dash" d="M360 170 L360 642"/>
  <rect class="label-bg" x="311" y="600" width="98" height="18" rx="7"/>
  <text class="label" x="360" y="613">예외 처리 · return 1</text>

  <path class="dash" d="M465 47 L700 47 L700 615 L592.5 615 L592.5 642"/>
  <rect class="label-bg" x="591" y="601" width="108" height="18" rx="7"/>
  <text class="label" x="645" y="614">argparse 오류</text>
</svg>